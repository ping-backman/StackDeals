<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support | StackDeals</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --line: #e2e8f0; --text: #0f172a; --muted: #64748b; --primary: #2563eb; --radius: 12px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--primary); text-decoration: none; }
    .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; flex: 1; }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 0; }
    .nav-wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: 800; color: var(--text); text-decoration: none; }
    
    .form-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .form-card h1 { font-size: 24px; margin-bottom: 8px; }
    .form-card p { color: var(--muted); margin-bottom: 24px; font-size: 15px; }
    
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    input, textarea, select { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; font-family: inherit; margin-bottom: 16px; outline: none; transition: border 0.2s; }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    textarea { min-height: 120px; resize: vertical; }
    
    .btn { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    
    .msg { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; text-align: center; display: none; }
    .msg-ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .msg-err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  </style>

    </div>
  </header>

  <main class="container">
    <div class="form-card">
      <h1>Contact Support</h1>
      <p>Have a question about a giveaway, your entries, or a technical issue? Fill out the form below and we'll get back to you within 24–48 hours.</p>
      
      <div id="msg" class="msg"></div>
      
      <form id="contact-form">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="Jane Doe">
        
        <label for="email">Your Email Address</label>
        <input type="email" id="email" name="email" required placeholder="jane@example.com">
        
        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="">Select a topic...</option>
          <option value="giveaway_question">Question about a Giveaway</option>
          <option value="entry_issue">Issue with my entries/referral</option>
          <option value="technical">Technical / Website Bug</option>
          <option value="other">Other</option>
        </select>
        
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Please provide as much detail as possible..."></textarea>
        
        <div id="turnstile" style="margin-bottom: 16px; min-height: 65px;"></div>
        
        <button type="submit" id="submit-btn" class="btn" disabled>Send Message</button>
      </form>
    </div>
  </main>

  <script>
    (function() {
      const form = document.getElementById('contact-form');
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submit-btn');
      let turnstileId = null;

      // Load Turnstile
      const loadTurnstile = () => {
        turnstileId = window.turnstile.render('#turnstile', {
          sitekey: '0x4AAAAAAGFNBZrXJTf5C2J5', // REPLACE WITH YOUR ACTUAL SITEKEY
          callback: () => { btn.disabled = false; btn.textContent = 'Send Message'; },
          'error-callback': () => { msg.className = 'msg msg-err'; msg.style.display = 'block'; msg.textContent = 'Security check failed to load. Please refresh.'; }
        });
      };

      if (window.turnstile) loadTurnstile();
      else {
        const s = document.createElement('script');
        s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        s.onload = loadTurnstile;
        document.head.appendChild(s);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true; btn.textContent = 'Sending...';
        msg.style.display = 'none';

        const payload = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          subject: document.getElementById('subject').value,
          message: document.getElementById('message').value,
          'cf-turnstile-response': window.turnstile.getResponse(turnstileId)
        };

        try {
          const res = await fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          
          if (data.ok) {
            msg.className = 'msg msg-ok';
            msg.textContent = 'Message sent successfully! We will reply to ' + payload.email + ' shortly.';
            msg.style.display = 'block';
            form.reset();
            window.turnstile.reset(turnstileId);
            btn.disabled = true; btn.textContent = 'Send Message';
          } else {
            throw new Error(data.error || 'Failed to send.');
          }
        } catch (err) {
          msg.className = 'msg msg-err';
          msg.textContent = err.message || 'Network error. Please try again.';
          msg.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Send Message';
          window.turnstile.reset(turnstileId);
        }
      });
    })();
  </script>
</body>
</html>
